[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xxxclaw"
version = "0.1.0"
description = "Minimal Python coding-agent based on xxxclaw-python-guide"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "lark-oapi",
]

[project.scripts]
xxxclaw = "app.main:main"
xxxclaw-feishu = "app.adapters.feishu.long_connection:main"

[tool.setuptools]
packages = ["app"]
